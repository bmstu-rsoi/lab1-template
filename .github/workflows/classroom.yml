name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Run unit tests
        run: |
          docker build -f tests/Dockerfile -t person-service-tests .
          docker run --rm person-service-tests

      - name: Build production image
        run: docker build -t person-service:${GITHUB_SHA} .

      - name: Deploy to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response=$(curl -fsS \
            -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${GITHUB_SHA}\"}")

          deploy_id=$(echo "$response" | jq -r '.id')

          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "Failed to create Render deployment"
            echo "$response"
            exit 1
          fi

          echo "Deployment ID: $deploy_id"

          for attempt in $(seq 1 60); do
            response=$(curl -fsS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")

            status=$(echo "$response" | jq -r '.status')

            echo "Deployment status: $status"

            if [ "$status" = "live" ]; then
              break
            fi

            case "$status" in
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "Deployment failed"
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 60 ]; then
              echo "Deployment timed out"
              exit 1
            fi

            sleep 10
          done

      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS \
              https://lab1-template-sfib.onrender.com/api/v1/persons \
              -o /dev/null; then
              echo "API is available"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 10
          done

          echo "API did not become available"
          exit 1


      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: postman/[inst] Lab1.postman_collection.json
          environment: postman/[inst][heroku] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 1
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"